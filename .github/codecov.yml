codecov:
  # https://docs.codecov.io/docs/comparing-commits
  require_ci_to_pass: true
  allow_coverage_offsets: true
coverage:
  status:
    project:
      default:
        informational: true
        target: auto  # auto compares coverage to the previous base commit
        if_ci_failed: success
    patch:
      default:
        informational: true
        target: 80%
        if_ci_failed: success
comment:
  layout: "condensed_header, condensed_files, condensed_footer"
  behavior: default
  require_changes: true

# The ML lanes only run when changed paths select them, and PR runs prune
# unaffected tests via Tach, so most commits upload a subset of the flags
# below. carryforward keeps the unuploaded flags at their last known value
# instead of dropping them, which otherwise reports a large phantom coverage
# loss on any PR that does not touch the ML paths.
flag_management:
  default_rules:
    carryforward: true
    statuses:
      - type: project
        target: auto
        informational: true
  individual_flags:
    - name: run-tests-core
      carryforward: true
    - name: run-tests-ml-ocr
      carryforward: true
    - name: run-tests-ml-pdf-model
      carryforward: true
    - name: run-tests-ml-vlm
      carryforward: true
    - name: run-tests-ml-asr
      carryforward: true
    - name: run-examples
      carryforward: true

component_management:
  default_rules:
    statuses:
      - type: project
        target: auto
        informational: true

  individual_components:
    - component_id: cli
      name: CLI
      paths:
        - docling/cli/**

    - component_id: backend
      name: Backend
      paths:
        - docling/backend/**

    - component_id: datamodel
      name: Datamodel
      paths:
        - docling/datamodel/**

    - component_id: models
      name: Models
      paths:
        - docling/models/**

    - component_id: pipelines
      name: Pipelines
      paths:
        - docling/pipeline/**

    - component_id: service-client
      name: Service Client
      paths:
        - docling/service_client/**

    - component_id: utilities
      name: Utilities
      paths:
        - docling/utils/**

# Preview surface, not shipped API: excluded from the coverage denominator
# so it neither inflates nor depresses the reported number. Anything moved
# out of docling/experimental/ must be removed from this list.
ignore:
  - "docling/experimental/**"
