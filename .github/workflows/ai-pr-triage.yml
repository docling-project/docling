name: "AI PR Triage"

# Advisory triage before a maintainer approves CI. It looks for duplicate PRs,
# checks if the change is safe to run in CI, summarizes reference data
# changes, and writes a first review with inline comments. No job checks out
# or runs code from the pull request.
#
# Every job checks out `github.sha`: for pull_request_target this is the
# current head of the base branch, the same commit as this workflow file. Do
# not use `github.event.pull_request.base.sha`: for a PR opened before a change
# to these scripts, that older commit does not have the scripts that this
# workflow calls.
#
# The workflow is a review aid, not a gate. Every step uses continue-on-error,
# and long steps have a timeout below the job timeout, so a problem shows as a
# warning annotation and never as a failed check on the PR.
#
# Maintainers can comment `/ai review` (or `/ai`) for a new full review and
# `/ai triage` to run the triage again. After a maintainer comments on or
# reviews a PR, pushes run only the triage, not the review. Pushes also run
# only the triage after two AI reviews.
on:
  pull_request_target:
    types: [opened, reopened, synchronize, ready_for_review]
  issue_comment:
    types: [created]

concurrency:
  # Other comments must not cancel a running triage, so they get their own group.
  group: >-
    ${{ github.workflow }}-${{ github.event.pull_request.number || github.event.issue.number }}-${{
    (github.event_name == 'pull_request_target' ||
    (startsWith(github.event.comment.body, '/ai') &&
    contains(fromJSON('["OWNER", "MEMBER", "COLLABORATOR"]'), github.event.comment.author_association)))
    && 'pr' || github.run_id }}
  cancel-in-progress: true

permissions: {}

jobs:
  context:
    # Cheap filter first: most comments are not /ai commands from maintainers.
    # ai_pr_event.py validates the event again.
    if: >-
      github.event_name == 'pull_request_target' ||
      (github.event.issue.pull_request &&
      startsWith(github.event.comment.body, '/ai') &&
      contains(fromJSON('["OWNER", "MEMBER", "COLLABORATOR"]'), github.event.comment.author_association))
    runs-on: ubuntu-latest
    timeout-minutes: 5
    continue-on-error: true
    permissions:
      contents: read
      issues: write
    outputs:
      pr: ${{ steps.resolve.outputs.pr }}
      run: ${{ steps.resolve.outputs.run }}
      force_review: ${{ steps.resolve.outputs.force_review }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        continue-on-error: true
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
          persist-credentials: false
          sparse-checkout: .github/scripts

      - name: Resolve the PR and the mode
        id: resolve
        continue-on-error: true
        env:
          EVENT_NAME: ${{ github.event_name }}
        run: |
          python3 .github/scripts/ai_pr_event.py \
            --event-name "${EVENT_NAME}" --event-path "${GITHUB_EVENT_PATH}"

      - name: Confirm the command
        if: github.event_name == 'issue_comment' && steps.resolve.outputs.run == 'true'
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          COMMENT_ID: ${{ github.event.comment.id }}
        run: |
          gh api --method POST "repos/${REPO}/issues/comments/${COMMENT_ID}/reactions" \
            -f content=eyes > /dev/null

  reset-labels:
    # A new push makes the previous verdict stale.
    if: github.event_name == 'pull_request_target' && github.event.action == 'synchronize'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    continue-on-error: true
    permissions:
      pull-requests: write
    steps:
      - name: Remove stale AI labels
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          for label in ai:ci-safe ai:ci-needs-care ai:possible-duplicate ai:review-lgtm ai:review-changes; do
            gh pr edit "${PR_NUMBER}" --remove-label "${label}" || true
          done

  prepare:
    needs: context
    if: needs.context.outputs.run == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    continue-on-error: true
    permissions:
      contents: read
      pull-requests: read
      issues: read
    outputs:
      run_llm: ${{ steps.prepare.outputs.run_llm }}
      run_review: ${{ steps.prepare-review.outputs.run_review }}
    steps:
      # Trusted base branch only. The PR is read through the API and git objects.
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        continue-on-error: true
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
          persist-credentials: false

      - name: Collect deterministic triage data
        continue-on-error: true
        timeout-minutes: 10
        id: prepare
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          PR_NUMBER: ${{ needs.context.outputs.pr }}
        run: |
          python3 .github/scripts/ai_pr_triage.py prepare \
            --repo "${REPO}" --pr "${PR_NUMBER}" \
            --out "${RUNNER_TEMP}/ai-triage" --git-dir "${GITHUB_WORKSPACE}"

      - name: Collect review data
        continue-on-error: true
        timeout-minutes: 5
        id: prepare-review
        if: steps.prepare.outputs.run_llm == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          FORCE: ${{ needs.context.outputs.force_review == 'true' && '--force' || '' }}
        run: |
          python3 .github/scripts/ai_pr_review.py prepare \
            --repo "${REPO}" \
            --context-dir "${RUNNER_TEMP}/ai-triage" --git-dir "${GITHUB_WORKSPACE}" ${FORCE}

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        continue-on-error: true
        with:
          name: ai-triage-context
          path: ${{ runner.temp }}/ai-triage
          retention-days: 7

  analyze:
    needs: prepare
    if: needs.prepare.outputs.run_llm == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    continue-on-error: true
    # No GitHub write access here. The model output is validated and applied by
    # the publish job.
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        continue-on-error: true
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
          persist-credentials: false

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        continue-on-error: true
        with:
          name: ai-triage-context
          path: .ai-triage

      - name: Run Bob Shell (read-only mode)
        id: bob
        continue-on-error: true
        timeout-minutes: 15
        uses: ./.github/actions/run-bobshell
        with:
          api-key: ${{ secrets.BOB_API_KEY }}
          team-id: ${{ vars.BOB_TEAM_ID }}
          mode: docling-pr-triage
          prompt-file: .github/ai-triage/triage-prompt.md
          max-turns: "25"
          max-cost: ${{ vars.BOB_TRIAGE_MAX_COST || '2' }}
          output: ${{ runner.temp }}/bob-output.json

      - name: Validate the answer
        continue-on-error: true
        if: steps.bob.outcome == 'success'
        env:
          BOB_API_KEY: ${{ secrets.BOB_API_KEY }}
        run: |
          mkdir -p "${RUNNER_TEMP}/ai-triage-result"
          result="${RUNNER_TEMP}/ai-triage-result/result.json"
          python3 .github/scripts/ai_pr_triage.py extract \
            --bob-output "${RUNNER_TEMP}/bob-output.json" \
            --context .ai-triage/context.json \
            --out "${result}" || exit 0
          # Defense in depth: never publish text that contains the API key.
          if grep -qF -- "${BOB_API_KEY}" "${result}"; then
            echo "::error::The answer contains the API key. It is discarded."
            rm -f "${result}"
          fi

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        continue-on-error: true
        with:
          name: ai-triage-result
          path: ${{ runner.temp }}/ai-triage-result
          if-no-files-found: ignore
          retention-days: 7

  publish:
    needs: [context, prepare, analyze]
    # run_llm is set only when the prepare step succeeded.
    if: always() && needs.prepare.outputs.run_llm != ''
    runs-on: ubuntu-latest
    timeout-minutes: 10
    continue-on-error: true
    permissions:
      contents: read
      pull-requests: write
      issues: write
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        continue-on-error: true
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
          persist-credentials: false
          sparse-checkout: .github/scripts

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        continue-on-error: true
        with:
          name: ai-triage-context
          path: ${{ runner.temp }}/ai-triage

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        continue-on-error: true
        with:
          name: ai-triage-result
          path: ${{ runner.temp }}/ai-triage-result

      - name: Apply labels and update the triage comment
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          PR_NUMBER: ${{ needs.context.outputs.pr }}
        run: |
          python3 .github/scripts/ai_pr_triage.py publish \
            --repo "${REPO}" --pr "${PR_NUMBER}" \
            --context "${RUNNER_TEMP}/ai-triage/context.json" \
            --result "${RUNNER_TEMP}/ai-triage-result/result.json"

  review:
    # Runs after the triage, so it can skip PRs rated as duplicates.
    needs: [context, prepare, analyze]
    if: >-
      always() &&
      needs.prepare.result == 'success' &&
      needs.prepare.outputs.run_review == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    continue-on-error: true
    permissions:
      contents: read
    steps:
      # The full base checkout lets the model read callers, tests, and skills.
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        continue-on-error: true
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
          persist-credentials: false

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        continue-on-error: true
        with:
          name: ai-triage-context
          path: .ai-triage

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        continue-on-error: true
        with:
          name: ai-triage-result
          path: ${{ runner.temp }}/ai-triage-result

      - name: Skip duplicates
        continue-on-error: true
        id: gate
        env:
          FORCE_REVIEW: ${{ needs.context.outputs.force_review }}
        run: |
          if [ "${FORCE_REVIEW}" = "true" ]; then
            echo "A maintainer asked for this review with /ai review."
            echo "run=true" >> "${GITHUB_OUTPUT}"
          elif python3 .github/scripts/ai_pr_review.py gate \
              --triage-result "${RUNNER_TEMP}/ai-triage-result/result.json" \
              --context .ai-triage/context.json; then
            echo "run=true" >> "${GITHUB_OUTPUT}"
          else
            echo "The triage rated this PR as a duplicate. No AI review."
            echo "run=false" >> "${GITHUB_OUTPUT}"
          fi

      # The model reads the source of the dependencies instead of guessing
      # their behavior. The versions come from the lock file of the trusted
      # base branch. Nothing from the PR is installed. Torch and the CUDA
      # packages are left out: they are large and the reviews do not need them.
      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7.6.0
        if: steps.gate.outputs.run == 'true'
        continue-on-error: true
        with:
          python-version: "3.12"
          enable-cache: false

      - name: Install the dependencies for reading
        if: steps.gate.outputs.run == 'true'
        continue-on-error: true
        timeout-minutes: 8
        run: |
          requirements="${RUNNER_TEMP}/review-requirements.txt"
          uv export --frozen --all-packages --no-dev --no-hashes --no-header \
            --no-annotate --no-emit-workspace --extra feat-ocr-easyocr \
            | grep -vE '^(torch|torchvision|triton|nvidia-|cuda-)' > "${requirements}"
          uv venv .venv
          uv pip install --python .venv --no-deps -r "${requirements}"

      - name: Run Bob Shell (read-only review mode)
        id: bob
        if: steps.gate.outputs.run == 'true'
        continue-on-error: true
        timeout-minutes: 25
        uses: ./.github/actions/run-bobshell
        with:
          api-key: ${{ secrets.BOB_API_KEY }}
          team-id: ${{ vars.BOB_TEAM_ID }}
          mode: docling-pr-review
          prompt-file: .github/ai-triage/review-prompt.md
          max-turns: "40"
          max-cost: ${{ vars.BOB_REVIEW_MAX_COST || '3' }}
          output: ${{ runner.temp }}/bob-review-output.json

      - name: Validate the review
        continue-on-error: true
        if: steps.bob.outcome == 'success'
        env:
          BOB_API_KEY: ${{ secrets.BOB_API_KEY }}
        run: |
          mkdir -p "${RUNNER_TEMP}/ai-review-result"
          result="${RUNNER_TEMP}/ai-review-result/review.json"
          python3 .github/scripts/ai_pr_review.py extract \
            --bob-output "${RUNNER_TEMP}/bob-review-output.json" \
            --context-dir .ai-triage \
            --out "${result}" || exit 0
          if grep -qF -- "${BOB_API_KEY}" "${result}"; then
            echo "::error::The review contains the API key. It is discarded."
            rm -f "${result}"
          fi

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        continue-on-error: true
        with:
          name: ai-review-result
          path: ${{ runner.temp }}/ai-review-result
          if-no-files-found: ignore
          retention-days: 7

  publish-review:
    needs: [context, prepare, review]
    if: always() && needs.review.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    continue-on-error: true
    permissions:
      contents: read
      pull-requests: write
      issues: write
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        continue-on-error: true
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
          persist-credentials: false
          sparse-checkout: .github/scripts

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        continue-on-error: true
        with:
          name: ai-triage-context
          path: ${{ runner.temp }}/ai-triage

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        id: result
        continue-on-error: true
        with:
          name: ai-review-result
          path: ${{ runner.temp }}/ai-review-result

      - name: Post the review and set the label
        continue-on-error: true
        if: steps.result.outcome == 'success'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          PR_NUMBER: ${{ needs.context.outputs.pr }}
        run: |
          python3 .github/scripts/ai_pr_review.py publish \
            --repo "${REPO}" --pr "${PR_NUMBER}" \
            --context-dir "${RUNNER_TEMP}/ai-triage" \
            --result "${RUNNER_TEMP}/ai-review-result/review.json"
